<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Facturas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }

        /* ── Filtro de fechas ── */
        .filtro {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            background: #fff; padding: 16px 24px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 24px; flex-wrap: wrap;
        }
        .filtro label { font-weight: 600; }
        .filtro input[type="date"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .filtro button {
            padding: 8px 24px; background: #4361ee; color: #fff; border: none;
            border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
        }
        .filtro button:hover { background: #3a56d4; }

        /* ── Tarjeta cliente top ── */
        .top-client {
            background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff;
            padding: 20px 28px; border-radius: 10px; margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(67,97,238,.3); text-align: center;
        }
        .top-client h2 { font-size: 16px; opacity: .85; margin-bottom: 6px; }
        .top-client .nombre { font-size: 26px; font-weight: 700; }
        .top-client .valor  { font-size: 20px; margin-top: 4px; opacity: .9; }

        /* ── Tabla ── */
        .tabla-container {
            background: #fff; border-radius: 10px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 24px; overflow-x: auto;
        }
        .tabla-container h2 { margin-bottom: 12px; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #4361ee; color: #fff; padding: 10px 14px; text-align: left; font-size: 14px; }
        td { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover td { background: #f7f8fc; }
        .estado-activo  { color: #2d6a4f; font-weight: 600; }
        .estado-anulada { color: #d00000; font-weight: 600; }

        /* ── Gráfica ── */
        .grafica-container {
            background: #fff; border-radius: 10px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 24px;
        }
        .grafica-container h2 { margin-bottom: 12px; color: #1a1a2e; }

        /* ── Loader & error ── */
        .loader { text-align: center; padding: 40px; font-size: 16px; color: #666; }
        .error  { text-align: center; padding: 20px; color: #d00000; font-weight: 600; }
        .empty  { text-align: center; padding: 30px; color: #999; }
    </style>
</head>
<body>

<h1>📊 Dashboard de Facturas</h1>

<!-- ════════ FILTRO DE FECHAS ════════ -->
<div class="filtro">
    <label for="fechaInicio">Desde:</label>
    <input type="date" id="fechaInicio" value="2026-01-01">
    <label for="fechaFin">Hasta:</label>
    <input type="date" id="fechaFin" value="2026-01-31">
    <button onclick="cargarDashboard()">🔍 Consultar</button>
</div>

<!-- ════════ CLIENTE CON MAYOR FACTURACIÓN ════════ -->
<div id="topClientSection" class="top-client" style="display:none;">
    <h2>🏆 Cliente con Mayor Facturación (solo Activas)</h2>
    <div class="nombre" id="topNombre"></div>
    <div class="valor" id="topValor"></div>
</div>

<!-- ════════ TABLA DE REGISTROS ════════ -->
<div class="tabla-container">
    <h2>📋 Registros del Periodo</h2>
    <div id="tablaContent"><div class="empty">Selecciona un rango de fechas y presiona Consultar</div></div>
</div>

<!-- ════════ GRÁFICA DE VENTAS POR DÍA ════════ -->
<div class="grafica-container">
    <h2>📈 Ventas Consolidadas por Día (solo Activas)</h2>
    <canvas id="ventasChart" height="100"></canvas>
    <div id="graficaEmpty" class="empty">Sin datos para graficar</div>
</div>

<script>
    // ═══════════════════════════════════════════════════════
    //  CONFIGURACIÓN -
    //  otro puerto o dirección
    // ═══════════════════════════════════════════════════════
    const API_BASE = 'http://localhost:8080/api/v1/invoices';

    let chartInstance = null;

    // ═══════════════════════════════════════════════════════
    //  FUNCIÓN PRINCIPAL: Llama al endpoint y pinta todo
    // ═══════════════════════════════════════════════════════
    async function cargarDashboard() {
        const fechaInicio = document.getElementById('fechaInicio').value;
        const fechaFin    = document.getElementById('fechaFin').value;

        if (!fechaInicio || !fechaFin) {
            alert('Por favor selecciona ambas fechas');
            return;
        }

        // Mostrar loader
        document.getElementById('tablaContent').innerHTML = '<div class="loader">⏳ Cargando...</div>';
        document.getElementById('topClientSection').style.display = 'none';
        document.getElementById('graficaEmpty').style.display = 'none';

        try {
            const url = `${API_BASE}/dashboard?fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`;
            const resp = await fetch(url);

            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || 'Error al consultar la API');
            }

            const data = await resp.json();
            const { registros, clienteMayorFacturacion, ventasPorDia } = data.results;

            pintarTabla(registros);
            pintarTopClient(clienteMayorFacturacion);
            pintarGrafica(ventasPorDia);

        } catch (e) {
            document.getElementById('tablaContent').innerHTML = `<div class="error">❌ ${e.message}</div>`;
            console.error(e);
        }
    }

    // ═══════════════════════════════════════════════════════
    //  1) TABLA DE REGISTROS
    // ═══════════════════════════════════════════════════════
    function pintarTabla(registros) {
        const container = document.getElementById('tablaContent');

        if (!registros || registros.length === 0) {
            container.innerHTML = '<div class="empty">No se encontraron registros en este periodo</div>';
            return;
        }

        let html = `<table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Valor de Venta</th>
                    <th>Estado</th>
                </tr>
            </thead><tbody>`;

        registros.forEach(r => {
            const claseEstado = r.factEstado === 'Activo' ? 'estado-activo' : 'estado-anulada';
            html += `<tr>
                <td>${r.factId}</td>
                <td>${r.factFecha}</td>
                <td>${r.clienteNombre}</td>
                <td>$ ${Number(r.factTotal).toLocaleString('es-CO')}</td>
                <td class="${claseEstado}">${r.factEstado}</td>
            </tr>`;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════
    //  2) CLIENTE CON MAYOR FACTURACIÓN
    // ═══════════════════════════════════════════════════════
    function pintarTopClient(top) {
        const section = document.getElementById('topClientSection');

        if (!top) {
            section.style.display = 'none';
            return;
        }

        document.getElementById('topNombre').textContent = top.clienteNombre;
        document.getElementById('topValor').textContent  = `$ ${Number(top.totalFacturado).toLocaleString('es-CO')}`;
        section.style.display = 'block';
    }

    // ═══════════════════════════════════════════════════════
    //  3) GRÁFICA DE VENTAS POR DÍA (Chart.js)
    // ═══════════════════════════════════════════════════════
    function pintarGrafica(ventasPorDia) {
        const canvas    = document.getElementById('ventasChart');
        const emptyMsg  = document.getElementById('graficaEmpty');

        // Destruir gráfica anterior si existe
        if (chartInstance) { chartInstance.destroy(); }

        if (!ventasPorDia || ventasPorDia.length === 0) {
            canvas.style.display = 'none';
            emptyMsg.style.display = 'block';
            return;
        }

        canvas.style.display  = 'block';
        emptyMsg.style.display = 'none';

        const labels = ventasPorDia.map(v => v.fecha);
        const datos  = ventasPorDia.map(v => v.totalVenta);

        chartInstance = new Chart(canvas, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Venta del día ($)',
                    data: datos,
                    backgroundColor: 'rgba(67, 97, 238, 0.7)',
                    borderColor: '#4361ee',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: ctx => `$ ${Number(ctx.raw).toLocaleString('es-CO')}`
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: val => `$ ${Number(val).toLocaleString('es-CO')}`
                        }
                    }
                }
            }
        });
    }
</script>

</body>
</html>
